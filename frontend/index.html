<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Interface Web de consultation SmartEnergy Hub : santé, capteurs, analyses, métriques et scénarios de recette.">
  <title>SmartEnergy Hub — Interface de consultation</title>
  <link rel="stylesheet" href="/styles.css">
  <!-- Chart.js 4.4.7 vendorisé (MIT) : aucun appel réseau externe. -->
  <script src="/vendor/chart.umd.js"></script>
</head>
<body>
  <a class="skip-link" href="#app">Aller au contenu</a>

  <header class="topbar">
    <a class="brand" href="#/dashboard" aria-label="SmartEnergy Hub, tableau de bord">
      <span class="brand__mark" aria-hidden="true">⚡</span>
      <span class="brand__text">
        <strong>SmartEnergy Hub</strong>
        <small>Interface de consultation · EXT-UI</small>
      </span>
    </a>

    <nav class="nav" aria-label="Navigation principale">
      <a href="#/dashboard" data-nav="/dashboard">Tableau de bord</a>

      <a href="#/system" data-nav="/system">Système</a>

    <span class="footer__links">

  <script type="module" src="/app.js"></script>
