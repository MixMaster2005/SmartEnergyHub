# ============================================================
# Storage Service - configuration externe (ENF-02)
# ============================================================
spring.application.name=storage-service
server.port=${STORAGE_PORT:8082}

# Observabilite minimale (ENF-06)
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# Redis Streams : consommation via consumer group
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
app.redis.stream=${REDIS_STREAM:energy-measurements}
app.redis.consumer-group=${REDIS_CONSUMER_GROUP:storage-group}
app.redis.consumer-name=${HOSTNAME:storage-1}

# Cassandra : mesures temporelles
spring.cassandra.contact-points=${CASSANDRA_HOST:localhost}
spring.cassandra.port=${CASSANDRA_PORT:9042}
spring.cassandra.keyspace-name=${CASSANDRA_KEYSPACE:smartenergy}
spring.cassandra.local-datacenter=${CASSANDRA_DC:dc1}
# Le schema est cree par scripts/init-cassandra.cql, pas par l'application.
spring.cassandra.schema-action=none

# MongoDB : metadonnees capteurs + agregats
spring.mongodb.host=${MONGO_HOST:localhost}
spring.mongodb.port=${MONGO_PORT:27017}
spring.mongodb.database=${MONGO_DATABASE:smartenergy}
spring.mongodb.username=${MONGO_USER:smartenergy}
spring.mongodb.password=${MONGO_PASSWORD:smartenergy_dev}
spring.mongodb.authentication-database=admin
