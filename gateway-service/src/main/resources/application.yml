spring:
  application:
    name: gateway-service
  web:
    resources:
      # Accueil frontend : dossier monte dans le conteneur (./frontend -> /app/frontend).
      # Le repli classpath sert le placeholder en lancement local (java -jar).
      static-locations: "file:${SMARTENERGY_FRONTEND_DIR:/app/frontend}/,classpath:/static/"
  cloud:
    gateway:
      # Namespace Spring Cloud Gateway 4.3 (les anciennes cles spring.cloud.gateway.*
      # sont depreciees depuis la 4.3 et declenchent un avertissement de migration).
      server:
        webflux:
          globalcors:
            # Repond aussi aux preflights OPTIONS hors routes (WebFlux).
            add-to-simple-url-handler-mapping: true
            cors-configurations:
              '[/**]':
                allowedOrigins: "${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}"
                allowedMethods: [GET, POST, PUT, PATCH, DELETE, OPTIONS]
                allowedHeaders: "*"
                exposedHeaders: [X-Request-Id, X-Event-Id, Retry-After]
                allowCredentials: false
                maxAge: 3600
          routes:
            # ---------------------------------------------------------- metier
            # L'ordre explicite (croissant) garantit D-17 : daily-summary avant
            # la regle generale /api/sensors/**.
            - id: collector-post
              uri: ${COLLECTOR_URI:http://localhost:8081}
              order: 0
              predicates:
                - Path=/api/measurements
                - Method=POST
            - id: storage-read
              uri: ${STORAGE_URI:http://localhost:8082}
              order: 1
              predicates:
                - Path=/api/measurements/**
                - Method=GET
            - id: analytics-daily-summary-alias
              uri: ${ANALYTICS_URI:http://localhost:8083}
              order: 2
              predicates:
                - Path=/api/sensors/*/daily-summary
                - Method=GET
            - id: sensors
              uri: ${SENSOR_URI:http://localhost:8084}
              order: 3
              predicates:
                - Path=/api/sensors/**
            - id: analytics
              uri: ${ANALYTICS_URI:http://localhost:8083}
              order: 4
              predicates:
                - Path=/api/analytics/**

            # ------------------------------------------------------------- ops
            # Memes routes de sante que les services, derriere une seule origine.
            # Le prefixe est retire : /collector/actuator/health -> /actuator/health.
            - id: collector-ops
              uri: ${COLLECTOR_URI:http://localhost:8081}
              order: 10
              predicates:
                - Path=/collector/**
              filters:
                - StripPrefix=1
            - id: storage-ops
              uri: ${STORAGE_URI:http://localhost:8082}
              order: 11
              predicates:
                - Path=/storage/**
              filters:
                - StripPrefix=1
            - id: analytics-ops
              uri: ${ANALYTICS_URI:http://localhost:8083}
              order: 12
              predicates:
                - Path=/analytics/**
              filters:
                - StripPrefix=1
            - id: sensor-ops
              uri: ${SENSOR_URI:http://localhost:8084}
              order: 13
              predicates:
                - Path=/sensor/**
              filters:
                - StripPrefix=1

            # ------------------------------------------------------ Swagger UI
            # Un document OpenAPI par service, consomme par springdoc cote gateway.
            - id: collector-api-docs
              uri: ${COLLECTOR_URI:http://localhost:8081}
              order: 20
              predicates:
                - Path=/v3/api-docs/collector
              filters:
                - SetPath=/v3/api-docs
            - id: storage-api-docs
              uri: ${STORAGE_URI:http://localhost:8082}
              order: 21
              predicates:
                - Path=/v3/api-docs/storage
              filters:
                - SetPath=/v3/api-docs
            - id: analytics-api-docs
              uri: ${ANALYTICS_URI:http://localhost:8083}
              order: 22
              predicates:
                - Path=/v3/api-docs/analytics
              filters:
                - SetPath=/v3/api-docs
            - id: sensor-api-docs
              uri: ${SENSOR_URI:http://localhost:8084}
              order: 23
              predicates:
                - Path=/v3/api-docs/sensor
              filters:
                - SetPath=/v3/api-docs

server:
  port: ${SERVER_PORT:8080}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    disable-swagger-default-url: true
    urls:
      - name: collector-service
        url: /v3/api-docs/collector
      - name: storage-service
        url: /v3/api-docs/storage
      - name: analytics-service
        url: /v3/api-docs/analytics
      - name: sensor-service
        url: /v3/api-docs/sensor

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,gateway
  endpoint:
    health:
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState
  metrics:
    tags:
      application: ${spring.application.name}

logging:
  pattern:
    level: "%5p [%X{traceId:-}]"
