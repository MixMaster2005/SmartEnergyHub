# ============================================================
# Collector Service - configuration externe (ENF-02)
# Toutes les valeurs sont surchargeables par variables d'environnement.
# ============================================================
spring.application.name=collector-service
server.port=${COLLECTOR_PORT:8081}

# Observabilite minimale (ENF-06)
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# Redis Streams : buffer d'evenements
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}

# Parametres applicatifs (stream de publication)
app.redis.stream=${REDIS_STREAM:energy-measurements}
