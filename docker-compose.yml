# ============================================================
# SmartEnergy Hub - Orchestration Docker Compose (ENF-03, ENF-04)
# ------------------------------------------------------------
# Le projet est decoupe en deux profils :
#   - (defaut)   : infrastructure uniquement -> Redis, Cassandra, MongoDB
#   - app        : infrastructure + services applicatifs Spring Boot + simulateur
#
# Demarrage infra seule (recommande en developpement, machine limitee) :
#   docker-compose up -d
# Demarrage complet :
#   docker-compose --profile app up -d --build
# Arret :
#   docker-compose --profile app down
#
# Chaque service est borne en memoire (mem_limit / mem_reservation) afin de
# tenir sur une machine de 8 Go (limitation de volume/ressources par projet).
# Les ports sont exposes uniquement sur 127.0.0.1 (ENF-07).
# ============================================================

name: smartenergy-hub

networks:
  smartenergy-net:
    name: smartenergy-net
    driver: bridge

volumes:
  smartenergy_redis_data:
    name: smartenergy_redis_data
  smartenergy_cassandra_data:
    name: smartenergy_cassandra_data
  smartenergy_mongo_data:
    name: smartenergy_mongo_data

services:

  # ----------------------------------------------------------
  # Redis Streams : tampon d'evenements (energy-measurements)
  # ----------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: smartenergy-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--save", "60", "1"]
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - smartenergy_redis_data:/data
    networks:
      - smartenergy-net
    mem_limit: ${REDIS_MEM_LIMIT:-256m}
    mem_reservation: ${REDIS_MEM_RESERVATION:-96m}
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  # ----------------------------------------------------------
  # Cassandra : mesures temporelles (measurements_by_sensor_day)
  # Demarrage lent (~60-90s) -> start_period eleve.
  # ----------------------------------------------------------
  cassandra:
    image: cassandra:4.1
    container_name: smartenergy-cassandra
    restart: unless-stopped
    ports:
      - "127.0.0.1:${CASSANDRA_PORT:-9042}:9042"
    environment:
      - CASSANDRA_CLUSTER_NAME=${CASSANDRA_CLUSTER_NAME:-smartenergy-cluster}
      - CASSANDRA_DC=${CASSANDRA_DC:-dc1}
      - CASSANDRA_ENDPOINT_SNITCH=SimpleSnitch
      - MAX_HEAP_SIZE=${CASSANDRA_MAX_HEAP:-512M}
      - HEAP_NEWSIZE=${CASSANDRA_HEAP_NEWSIZE:-128M}
    volumes:
      - smartenergy_cassandra_data:/var/lib/cassandra
    networks:
      - smartenergy-net
    mem_limit: ${CASSANDRA_MEM_LIMIT:-1g}
    mem_reservation: ${CASSANDRA_MEM_RESERVATION:-512m}
    healthcheck:
      test: ["CMD-SHELL", "nodetool status | grep -q '^UN'"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 90s

  # ----------------------------------------------------------
  # MongoDB : metadonnees capteurs + agregats
  # ----------------------------------------------------------
  mongodb:
    image: mongo:7
    container_name: smartenergy-mongodb
    restart: unless-stopped
    ports:
      - "127.0.0.1:${MONGO_PORT:-27017}:27017"
    environment:
      - MONGO_INITDB_ROOT_USERNAME=${MONGO_ROOT_USER:-root}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_ROOT_PASSWORD:-root_dev}
      - MONGO_INITDB_DATABASE=${MONGO_DATABASE:-smartenergy}
    volumes:
      - smartenergy_mongo_data:/data/db
    networks:
      - smartenergy-net
    mem_limit: ${MONGO_MEM_LIMIT:-512m}
    mem_reservation: ${MONGO_MEM_RESERVATION:-256m}
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --host localhost --username $$MONGO_INITDB_ROOT_USERNAME --password $$MONGO_INITDB_ROOT_PASSWORD --authenticationDatabase admin --eval \"db.adminCommand('ping').ok\" | grep -q 1"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 20s

  # ==========================================================
  # SERVICES APPLICATIFS (profil "app")
  # Ne demarrent que si --profile app est fourni.
  # ==========================================================

  collector-service:
    profiles: ["app"]
    build:
      context: ./collector-service
      dockerfile: Dockerfile
    image: smartenergy/collector-service:local
    container_name: smartenergy-collector
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_STREAM=${REDIS_STREAM:-energy-measurements}
      - JAVA_TOOL_OPTIONS=${SPRING_JAVA_OPTS:--XX:MaxRAMPercentage=60 -XX:+UseSerialGC}
    ports:
      - "127.0.0.1:${COLLECTOR_PORT:-8081}:8081"
    networks:
      - smartenergy-net
    mem_limit: ${SPRING_MEM_LIMIT:-512m}
    mem_reservation: 256m

  storage-service:
    profiles: ["app"]
    build:
      context: ./storage-service
      dockerfile: Dockerfile
    image: smartenergy/storage-service:local
    container_name: smartenergy-storage
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
      cassandra:
        condition: service_healthy
      mongodb:
        condition: service_healthy
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_STREAM=${REDIS_STREAM:-energy-measurements}
      - REDIS_CONSUMER_GROUP=${REDIS_CONSUMER_GROUP:-storage-group}
      - CASSANDRA_HOST=cassandra
      - CASSANDRA_PORT=9042
      - CASSANDRA_KEYSPACE=${CASSANDRA_KEYSPACE:-smartenergy}
      - MONGO_HOST=mongodb
      - MONGO_PORT=27017
      - MONGO_DATABASE=${MONGO_DATABASE:-smartenergy}
      - MONGO_USER=${MONGO_USER:-smartenergy}
      - MONGO_PASSWORD=${MONGO_PASSWORD:-smartenergy_dev}
      - JAVA_TOOL_OPTIONS=${SPRING_JAVA_OPTS:--XX:MaxRAMPercentage=60 -XX:+UseSerialGC}
    ports:
      - "127.0.0.1:${STORAGE_PORT:-8082}:8082"
    networks:
      - smartenergy-net
    mem_limit: ${SPRING_MEM_LIMIT:-512m}
    mem_reservation: 256m

  analytics-service:
    profiles: ["app"]
    build:
      context: ./analytics-service
      dockerfile: Dockerfile
    image: smartenergy/analytics-service:local
    container_name: smartenergy-analytics
    restart: unless-stopped
    depends_on:
      cassandra:
        condition: service_healthy
      mongodb:
        condition: service_healthy
    environment:
      - CASSANDRA_HOST=cassandra
      - CASSANDRA_PORT=9042
      - CASSANDRA_KEYSPACE=${CASSANDRA_KEYSPACE:-smartenergy}
      - MONGO_HOST=mongodb
      - MONGO_PORT=27017
      - MONGO_DATABASE=${MONGO_DATABASE:-smartenergy}
      - MONGO_USER=${MONGO_USER:-smartenergy}
      - MONGO_PASSWORD=${MONGO_PASSWORD:-smartenergy_dev}
      - JAVA_TOOL_OPTIONS=${SPRING_JAVA_OPTS:--XX:MaxRAMPercentage=60 -XX:+UseSerialGC}
    ports:
      - "127.0.0.1:${ANALYTICS_PORT:-8083}:8083"
    networks:
      - smartenergy-net
    mem_limit: ${SPRING_MEM_LIMIT:-512m}
    mem_reservation: 256m

  simulator:
    profiles: ["app"]
    build:
      context: ./simulator
      dockerfile: Dockerfile
    image: smartenergy/simulator:local
    container_name: smartenergy-simulator
    restart: unless-stopped
    depends_on:
      collector-service:
        condition: service_started
    environment:
      - SIMULATOR_INTERVAL_SECONDS=${SIMULATOR_INTERVAL_SECONDS:-2}
      - SIMULATOR_SENSORS=${SIMULATOR_SENSORS:-SENSOR-001,SENSOR-002,SENSOR-003,SENSOR-004,SENSOR-005}
      - SIMULATOR_COLLECTOR_URL=${SIMULATOR_COLLECTOR_URL:-http://collector-service:8081/api/measurements}
      - SIMULATOR_PEAK_FACTOR=${SIMULATOR_PEAK_FACTOR:-3}
      - SIMULATOR_PEAK_PROBABILITY=${SIMULATOR_PEAK_PROBABILITY:-0.05}
    networks:
      - smartenergy-net
    mem_limit: 128m
    mem_reservation: 64m
